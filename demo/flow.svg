<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 452" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" role="img" aria-labelledby="amv-demo-title">
  <title id="amv-demo-title">An agent session boots from the vault index, answers a question from one memory note, writes the new fact back, and saves a checkpoint before the context fills.</title>
  <style>
    .l { opacity: 0; animation: fadein 0.45s ease-out forwards; }
    @keyframes fadein { to { opacity: 1; } }
    .d0  { animation-delay: 0.3s; }
    .d1  { animation-delay: 1.0s; }
    .d2  { animation-delay: 1.9s; }
    .d3  { animation-delay: 2.7s; }
    .d4  { animation-delay: 3.4s; }
    .d5  { animation-delay: 4.2s; }
    .d6  { animation-delay: 4.5s; }
    .d7  { animation-delay: 5.3s; }
    .d8  { animation-delay: 6.1s; }
    .d9  { animation-delay: 6.9s; }
    @media (prefers-reduced-motion: reduce) {
      .l { animation: none; opacity: 1; }
    }
    .cmd { fill: #e6edf3; }
    .dim { fill: #98a4b0; }
    .usr { fill: #79c0ff; }
    .ans { fill: #d2e0f0; }
    .ok  { fill: #3fb950; }
    .wrt { fill: #bc8cff; }
    .wrn { fill: #d29922; }
  </style>

  <rect x="1" y="1" width="698" height="450" rx="12" fill="#0b0f14" stroke="#232b36"/>
  <rect x="1" y="1" width="698" height="40" rx="12" fill="#11161d"/>
  <rect x="1" y="27" width="698" height="14" fill="#11161d"/>
  <circle cx="26" cy="21" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="21" r="6" fill="#febc2e"/>
  <circle cx="66" cy="21" r="6" fill="#28c840"/>
  <text x="90" y="26" font-size="14" class="dim">agent session</text>

  <text x="24" y="86"  class="l d0"><tspan class="ok">$</tspan> <tspan class="cmd">claude</tspan></text>
  <text x="24" y="120" class="l d1"><tspan class="dim">◇ boot · read vault/INDEX.md, nothing else</tspan></text>
  <text x="24" y="162" class="l d2"><tspan class="usr">❯ what did we decide about pricing?</tspan></text>
  <text x="24" y="196" class="l d3"><tspan class="dim">◇ route → vault/memory/decisions.md</tspan></text>
  <text x="24" y="224" class="l d4"><tspan class="dim">◇ read · 14 lines</tspan></text>
  <text x="24" y="266" class="l d5"><tspan class="ans">Three tiers, not four. Ruled 2025-06-02:</tspan></text>
  <text x="24" y="294" class="l d6"><tspan class="ans">the fourth tier pulled buyers down.</tspan></text>
  <text x="24" y="336" class="l d7"><tspan class="wrt">✎ write-back → daily/2025-06-02.md</tspan></text>
  <text x="24" y="378" class="l d8"><tspan class="wrn">◇ context 92% · checkpoint saved</tspan></text>
  <text x="24" y="412" class="l d9"><tspan class="ok">⟲ next session resumes at full depth</tspan></text>
</svg>
